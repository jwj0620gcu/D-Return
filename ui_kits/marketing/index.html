<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1200"/>
  <title>Mastercard — Priceless possibilities</title>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <style>
    body { background: var(--bg); margin: 0; padding-bottom: 80px; }
    main { padding: 0 0 64px; }
    .section { padding: 96px 48px 32px; }
    .section-inner { max-width: 1180px; margin: 0 auto; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Buttons.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="EyebrowSection.jsx"></script>
  <script type="text/babel" src="Portrait.jsx"></script>
  <script type="text/babel" src="OrbitalArc.jsx"></script>
  <script type="text/babel" src="Constellation.jsx"></script>
  <script type="text/babel" src="PillCarousel.jsx"></script>
  <script type="text/babel" src="GhostSection.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="CookieBanner.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [showCookies, setShowCookies] = React.useState(true);
      return (
        <React.Fragment>
          <Nav activeLink="For you"/>
          <main>
            <Hero/>

            <section className="section">
              <div className="section-inner">
                <EyebrowSection
                  eyebrow="Services"
                  headline="A connected economy that works for everyone."
                  body="From small businesses to global networks, our solutions help money move with confidence — securely, instantly, and everywhere people want to be."
                />
                <Constellation/>
              </div>
            </section>

            <PillCarousel/>

            <GhostSection/>
          </main>
          <Footer/>
          {showCookies && <CookieBanner onClose={() => setShowCookies(false)}/>}
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
