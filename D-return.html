const { useEffect, useRef, useState } = React;

// ------- Reveal -------
const Reveal = ({ children, delay = 0, className = "", as: Tag = "div" }) => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {el.classList.add("is-in");io.disconnect();}
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</Tag>;
};

// ------- CountUp -------
const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const CountUp = ({ to, suffix = "", duration = 1800, format = (n) => n.toLocaleString("ko-KR"), className = "" }) => {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  useEffect(() => {
    const el = ref.current;if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        setVal(Math.round(easeOutExpo(t) * to));
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [to, duration]);
  return <span ref={ref} className={className}>{format(val)}{suffix}</span>;
};

const DOMAINS = [t('domain_1'), t('domain_2'), t('domain_3'), t('domain_4'), t('domain_5'), t('domain_6'), t('domain_7')];
const DATA_TYPES_BUY = [t('form_buy_type_1'), t('form_buy_type_2')];

const FormSection = () => {
  const [email, setEmail] = useState("");
  const [pickedTypes, setPickedTypes] = useState(new Set());
  const [domainOpen, setDomainOpen] = useState(false);
  const [pickedDomains, setPickedDomains] = useState(new Set());
  const [purpose, setPurpose] = useState("");
  const [done, setDone] = useState(false);
  const [loading, setLoading] = useState(false);
  const [submitErr, setSubmitErr] = useState("");
  const toggleType = (typ) => {
    const n = new Set(pickedTypes); n.has(typ) ? n.delete(typ) : n.add(typ); setPickedTypes(n);
    if (typ === t('form_buy_type_2')) setDomainOpen(!domainOpen);
  };
  const toggleDomain = (d) => {
    const n = new Set(pickedDomains); n.has(d) ? n.delete(d) : n.add(d); setPickedDomains(n);
  };
  const [emailErr, setEmailErr] = useState(false);
  const submit = (e) => {
    e.preventDefault();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!valid) { setEmailErr(true); return; }
    setEmailErr(false);
    setSubmitErr("");
    setLoading(true);
    fetch("https://api.airtable.com/v0/appMAGAikG2aoUD0l/tbl6ds2LQAAb7GClZ", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + window.AIRTABLE_TOKEN,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ fields: {
        "이메일": email,
        "데이터 유형": [...pickedTypes].join(", "),
        "도메인": [...pickedDomains].join(", "),
        "상세 문의": purpose,
      }}),
    })
      .then(async r => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok || data.error) {
          throw new Error(data.error?.message || data.message || `Airtable request failed (${r.status})`);
        }
        setDone(true);
      })
      .catch(err => {
        console.error("Airtable 제출 오류:", err);
        setSubmitErr(t('form_submit_err'));
      })
      .finally(() => setLoading(false));
  };

  return (
    <section id="request" className="py-14 sm:py-20 md:py-24 lg:py-32 bg-[#F3F0EE]">
        <div className="max-w-[1200px] mx-auto px-5 sm:px-8 md:px-12 lg:px-16">
          <Reveal>
            <div className="text-center">
              <span className="eyebrow">{t('form_buy_eyebrow')}</span>
              <h2 className="display text-white1 font-semibold mt-4 text-[24px] sm:text-[28px] md:text-[36px] leading-[1.18]">{t('form_buy_h2')}</h2>
              <p className="mt-4 md:mt-5 text-white2 text-[14px] sm:text-[15px] md:text-[16px] max-w-[520px] mx-auto">
                {t('form_buy_sub')}
              </p>
            </div>
          </Reveal>

          <Reveal delay={140}>
            <div className="mt-8 md:mt-12 max-w-[560px] mx-auto rounded-[24px] sm:rounded-[32px] md:rounded-[40px] border border-border overflow-hidden"
          style={{ boxShadow: "rgba(20,20,19,0.06) 0 16px 40px 0" }}>
              {done ?
            <div className="relative flex flex-col items-center justify-center text-center py-16 md:py-20 px-6 md:px-8" style={{ minHeight: 320 }}>
                  <div style={{
                    position: "absolute", inset: 0,
                    backgroundImage: "url('images/final-data.jpeg')",
                    backgroundSize: "cover", backgroundPosition: "center",
                  }} />
                  <div style={{ position: "absolute", inset: 0, background: "rgba(243,240,238,0.72)", backdropFilter: "blur(2px)" }} />
                  <div className="relative z-10 flex flex-col items-center">
                    <div style={{ position: "relative", width: 100, height: 100, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <div style={{ position: "absolute", inset: 0, borderRadius: "999px", background: "rgba(243,115,56,0.08)", animation: "ping-soft 1.4s ease-out forwards" }} />
                      <div style={{ position: "absolute", inset: 10, borderRadius: "999px", background: "rgba(243,115,56,0.13)", animation: "ping-soft 1.4s ease-out .15s forwards" }} />
                      <div style={{ position: "relative", width: 68, height: 68, borderRadius: "999px", background: "rgba(243,115,56,0.18)", display: "flex", alignItems: "center", justifyContent: "center", animation: "pop-in .4s cubic-bezier(.2,.7,.2,1) .1s both" }}>
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F37338" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                          style={{ animation: "draw-check .4s ease .45s both", strokeDasharray: 30, strokeDashoffset: 30 }}>
                          <path d="m5 12 5 5 9-12"/>
                        </svg>
                      </div>
                    </div>
                    <h3 className="display text-white1 font-bold mt-6 text-[24px]" style={{ animation: "fade-up .4s ease .55s both", opacity: 0 }}>
                      {t('form_buy_ok_h3')}
                    </h3>
                    <p className="mt-2 text-white2 text-[15px]" style={{ animation: "fade-up .4s ease .65s both", opacity: 0 }}>
                      {t('form_buy_ok_pre')}<span className="text-white1 font-medium">{email}</span>{t('form_buy_ok_post')}
                    </p>
                  </div>
                  <style>{`
                    @keyframes ping-soft { 0% { opacity:.6; transform:scale(.6); } 100% { opacity:0; transform:scale(1.6); } }
                    @keyframes pop-in   { 0% { opacity:0; transform:scale(.5); } 100% { opacity:1; transform:scale(1); } }
                    @keyframes draw-check { to { stroke-dashoffset: 0; } }
                    @keyframes fade-up  { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }
                  `}</style>
                </div> :

            <form onSubmit={submit} className="space-y-5 sm:space-y-6 p-5 sm:p-7 md:p-10 lg:p-12">
                  <div>
                    <label className="block text-[13px] text-mute mb-2.5">{t('form_buy_email_label')}</label>
                    <input type="email" value={email} onChange={(e) => { setEmail(e.target.value); setEmailErr(false); }}

                className="ring-signal w-full rounded-[999px] bg-field border text-white2 px-6 py-3.5 text-[15px] placeholder:text-mute outline-none transition"
                style={{ borderColor: emailErr ? "#F37338" : undefined }} />
                    {emailErr && (
                      <div className="mt-2 flex items-center gap-1.5 px-1" style={{ animation: "fade-up .25s ease both" }}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F37338" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                        <span className="text-[12.5px]" style={{ color: "#F37338" }}>{t('form_email_err')}</span>
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-[13px] text-mute mb-3">{t('form_buy_type_label')}</label>
                    <div className="flex flex-col gap-2.5">
                      {DATA_TYPES_BUY.map((typ) =>
                        <div key={typ}>
                          <label className="check inline-flex items-center gap-3 cursor-pointer group w-full">
                            <input type="checkbox" className="sr-only" checked={pickedTypes.has(typ)} onChange={() => toggleType(typ)} />
                            <span className="box w-[18px] h-[18px] rounded-[6px] border border-border2 inline-flex items-center justify-center flex-shrink-0 transition">
                              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m5 12 5 5 9-12" /></svg>
                            </span>
                            <span className="text-white2 text-[15px] group-hover:text-white1 transition flex-1">{typ}</span>
                            {typ === t('form_buy_type_2') && (
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                                style={{ color: "#A6A29C", transform: domainOpen ? "rotate(180deg)" : "rotate(0deg)", transition: "transform .2s ease" }}>
                                <path d="m6 9 6 6 6-6"/>
                              </svg>
                            )}
                          </label>
                          {typ === t('form_buy_type_2') && domainOpen && (
                            <div className="mt-2.5 ml-7 flex flex-wrap gap-2">
                              {DOMAINS.map((d) =>
                                <button key={d} type="button" onClick={() => toggleDomain(d)}
                                  className="px-3.5 py-1.5 rounded-[999px] text-[13px] border transition"
                                  style={{
                                    background: pickedDomains.has(d) ? "#F37338" : "transparent",
                                    borderColor: pickedDomains.has(d) ? "#F37338" : "#D1CDC7",
                                    color: pickedDomains.has(d) ? "#fff" : "#7a7a78",
                                  }}>
                                  {d}
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="block text-[13px] text-mute mb-2.5">{t('form_buy_note_label')} <span className="text-dim">{t('form_buy_note_opt')}</span></label>
                    <textarea rows="3" value={purpose} onChange={(e) => setPurpose(e.target.value)}
                placeholder={t('form_buy_note_ph')}
                className="ring-signal w-full rounded-[16px] bg-field border border-border2 text-white2 px-5 py-4 text-[15px] placeholder:text-mute outline-none transition resize-none" />
                  </div>

                  {submitErr && (
                    <div className="rounded-[14px] border px-4 py-3 text-[13px] leading-[1.5]"
                      style={{ borderColor: "rgba(243,115,56,0.35)", background: "rgba(243,115,56,0.08)", color: "#9A3D17" }}>
                      {submitErr}
                    </div>
                  )}
                  <PrimaryCTA type="submit" full disabled={loading}>
                    {loading ? (
                      <span className="inline-flex items-center gap-2">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
                          style={{ animation: "spin .7s linear infinite" }}>
                          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                        </svg>
                        {t('form_buy_submitting')}
                      </span>
                    ) : <span className="inline-flex items-center gap-2">{t('form_buy_submit')} <IconArrowRight width="18" height="18" /></span>}
                  </PrimaryCTA>
                  <style>{`.cta-glow[disabled]{opacity:.75;cursor:not-allowed;transform:none!important;} @keyframes spin{to{transform:rotate(360deg)}}`}</style>
                  <p className="text-center text-[13px] text-mute">
                    {t('form_buy_footer')}
                  </p>
                </form>
            }
            </div>
          </Reveal>
        </div>
      </section>);

};

    <div className="flex items-center gap-1">
      {dir === "left" && (
        <svg width="6" height="11" viewBox="0 0 6 11" fill="none" style={{ flexShrink: 0 }}>
          <path d="M6 0L0 5.5L6 11V0Z" fill={active ? "#F37338" : "#D1CDC7"} style={{ transition: "fill .3s" }} />
        </svg>
      )}
      <div className="flow-line flex-1" style={{ background: active ? "rgba(243,115,56,0.18)" : "rgba(20,20,19,0.09)" }}>
        <div className="flow-line-inner"
          style={{
            animation: `${dir === "right" ? "flowR" : "flowL"} 1.4s linear infinite`,
            opacity: active ? 1 : 0,
          }} />
      </div>
      {dir === "right" && (
        <svg width="6" height="11" viewBox="0 0 6 11" fill="none" style={{ flexShrink: 0 }}>
          <path d="M0 0L6 5.5L0 11V0Z" fill={active ? "#F37338" : "#D1CDC7"} style={{ transition: "fill .3s" }} />
        </svg>
      )}
    </div>
  </div>
);

const NodeCard = ({ img, imgPosition = "50% 50%", title, sub, active, onEnter, onLeave }) => (
  <div className="flex-shrink-0 flex flex-col items-center gap-3 cursor-pointer select-none"
    onMouseEnter={onEnter} onMouseLeave={onLeave}>
    <div className="node-photo rounded-full overflow-hidden border-4"
      role="img" aria-label={title}
      style={{
        width: 120, height: 120,
        borderColor: active ? "#F37338" : "#E8E2DA",
        boxShadow: active
          ? "0 0 0 6px rgba(243,115,56,0.12), 0 20px 48px rgba(20,20,19,0.14)"
          : "0 8px 24px rgba(20,20,19,0.08)",
        backgroundImage: `url(${img})`,
        backgroundSize: "cover",
        backgroundPosition: imgPosition,
      }}>
    </div>
    <div className="text-center">
      <div className="font-semibold text-[14px] sm:text-[15px] transition-colors duration-300"
        style={{ color: active ? "#F37338" : "#141413" }}>
        {title}
      </div>
      <div className="text-mute text-[11px] sm:text-[12px] mt-0.5">{sub}</div>
    </div>
  </div>
);

const MarketplaceFlow = () => {
  const [hovered, setHovered] = useState(null);
  const leftActive  = hovered === null || hovered === "supply" || hovered === "center";
  const rightActive = hovered === null || hovered === "demand" || hovered === "center";

  return (
    <section className="py-14 sm:py-20 md:py-24 lg:py-28 bg-[#F3F0EE]">
      <div className="max-w-[1280px] mx-auto px-5 sm:px-8 md:px-12 lg:px-16">
        <Reveal>
          <div className="text-center">
            <span className="eyebrow">{t('flow_eyebrow')}</span>
            <h2 className="display text-white1 font-bold mt-4 text-[24px] sm:text-[28px] md:text-[36px] leading-[1.18]">
              {t('flow_h2')}
            </h2>
            <p className="mt-4 text-white2 text-[14px] sm:text-[15px] max-w-[600px] mx-auto leading-[1.65]">
              {t('flow_subtitle')}
            </p>
          </div>
        </Reveal>
        <Reveal delay={120}>
          <div className="mt-12 md:mt-16 overflow-x-auto pb-4 -mx-2 px-2">
            <div className="flex items-center justify-between gap-4 md:gap-6 min-w-[580px]">
              <NodeCard
                img="images/company.jpg"
                title={t('flow_supplier_title')}
                sub={t('flow_supplier_sub')}
                active={hovered === "supply"}
                onEnter={() => setHovered("supply")}
                onLeave={() => setHovered(null)}
              />
              <div className="flex-1 flex flex-col gap-3.5 min-w-0">
                <FlowArrow dir="right" label={t('flow_arrow_raw')} active={leftActive} />
                <FlowArrow dir="left"  label={t('flow_arrow_revenue')} active={leftActive} />
              </div>
              <div className="flex-shrink-0 flex flex-col items-center gap-3 cursor-default"
                onMouseEnter={() => setHovered("center")}
                onMouseLeave={() => setHovered(null)}>
                <div className="rounded-full flex items-center justify-center border-2 transition-all duration-300"
                  style={{
                    width: 96, height: 96,
                    background: "#141413",
                    borderColor: hovered === "center" ? "#F37338" : "rgba(255,255,255,0.12)",
                    boxShadow: hovered
                      ? "0 0 40px rgba(243,115,56,0.28), 0 16px 40px rgba(20,20,19,0.22)"
                      : "0 12px 32px rgba(20,20,19,0.18)",
                  }}>
                  <span className="font-mono font-bold leading-none" style={{ fontSize: 17, letterSpacing: "-0.02em", color: "#fff" }}>
                    D<span style={{ color: "#F37338" }}>-</span>return
                  </span>
                </div>
                <div className="text-center">
                  <div className="font-mono font-bold text-[13px]" style={{ color: "#F37338" }}>{t('flow_hub_label')}</div>
                </div>
              </div>
              <div className="flex-1 flex flex-col gap-3.5 min-w-0">
                <FlowArrow dir="right" label={t('flow_arrow_delivery')} active={rightActive} />
                <FlowArrow dir="left"  label={t('flow_arrow_request')} active={rightActive} />
              </div>
              <NodeCard
                img="images/llm.png"
                imgPosition="35% 50%"
                title="AI / LLM"
                sub={t('flow_buyer_sub')}
                active={hovered === "demand"}
                onEnter={() => setHovered("demand")}
                onLeave={() => setHovered(null)}
              />
            </div>
          </div>
        </Reveal>
      </div>
    </section>
  );
};

// ------- App -------
const App = () => {
  const goForm = () => document.getElementById("request")?.scrollIntoView({ behavior: "smooth", block: "start" });
  return (
    <React.Fragment>
        <Nav current="buy" />
        <Hero onCTA={goForm} />
        <MarketplaceFlow />
        <Sources />
        <StatsSection />
        <ValueSection />
        <ArticlesSection />
        <FormSection />
        <Footer />
      </React.Fragment>);

};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
