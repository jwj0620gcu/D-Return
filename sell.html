const { useEffect, useRef, useState } = React;

// ------- Reveal -------
const Reveal = ({ children, delay = 0, className = "", as: Tag = "div" }) => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add("is-in"); io.disconnect(); }
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</Tag>;
};

// ------- CountUp -------
const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const CountUp = ({ to, suffix = "", duration = 1800, format = (n) => n.toLocaleString("ko-KR") }) => {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        setVal(Math.round(easeOutExpo(t) * to));
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [to, duration]);
  return <span ref={ref}>{format(val)}{suffix}</span>;
};

  {

    title: "폐업 비용 상쇄",
    body: "수년간 축적된 업무 데이터는 폐업 시 사라지는 무형 자산입니다. AI 학습 데이터로 전환해 임금·청산 비용의 일부를 회수할 수 있습니다.",
    bg: "images/final-data.jpeg",
  },
  {
    Icon: IconShield,
    title: "법적 책임 없음",
    body: "개인정보보호법, 데이터 소유권, 동의서 절차 — 복잡한 법적 처리를 D-return이 전담합니다. 판매자가 직접 처리할 사항은 없습니다.",

  },
  {

    bg: "images/ai-agent.jpg",
  },

const WhySellSection = () =>
  <section className="py-14 sm:py-20 md:py-24 lg:py-32">
    <div className="max-w-[1200px] mx-auto px-5 sm:px-8 md:px-12 lg:px-16">
      <Reveal>
        <span className="eyebrow">Why D-return</span>
        <h2 className="display text-white1 font-bold mt-4 text-[24px] sm:text-[28px] md:text-[36px] leading-[1.18] max-w-[600px]">
          왜 <span className="font-mono">D-return</span>에 판매하나요
        </h2>
      </Reveal>
      <div className="mt-8 md:mt-14 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">

              {bg && <div style={{ position: "absolute", inset: 0, backgroundImage: `url('${bg}')`, backgroundSize: "cover", backgroundPosition: "center", opacity: 0.13, borderRadius: "24px" }} />}
              <div style={{ position: "relative", zIndex: 1 }}>
                <div className="w-12 h-12 rounded-full inline-flex items-center justify-center"
                  style={{ background: "rgba(243,115,56,0.07)", color: "rgba(243,115,56,0.55)" }}>
                  <Icon width="22" height="22" />

                <h3 className="display text-white1 font-semibold mt-5 md:mt-7 text-[19px] sm:text-[21px] md:text-[24px] leading-[1.3]">{title}</h3>
                <p className="mt-3 md:mt-4 text-white2 text-[13px] sm:text-[14px] leading-[1.7]">{body}</p>
              </div>

        )}

// ------- Sell Form -------
const DATA_SOURCES = ["Slack", "Notion", "Gmail", "Google Drive", "Jira / Linear", "GitHub"];
const SITUATIONS   = ["폐업 예정 (3개월 내)", "이미 폐업 완료", "매각·인수 진행 중", "기타"];
const INDUSTRIES   = ["법", "교육", "의료", "금융", "물류", "마케팅", "CS", "기타"];

const SellForm = () => {
  const [company, setCompany]     = useState("");
  const [email, setEmail]         = useState("");
  const [sources, setSources]     = useState(new Set());
  const [situation, setSituation] = useState("");
  const [industry, setIndustry]   = useState("");
  const [note, setNote]           = useState("");
  const [emailErr, setEmailErr]   = useState(false);
  const [done, setDone]           = useState(false);
  const [loading, setLoading]     = useState(false);

  const toggleSource = (s) => {
    const n = new Set(sources); n.has(s) ? n.delete(s) : n.add(s); setSources(n);
  };

  const submit = (e) => {
    e.preventDefault();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!valid) { setEmailErr(true); return; }
    setEmailErr(false); setLoading(true);
    setTimeout(() => { setLoading(false); setDone(true); }, 1400);
  };

  return (
    <section id="sell-request" className="py-14 sm:py-20 md:py-24 lg:py-32 bg-charcoal">
      <div className="max-w-[1200px] mx-auto px-5 sm:px-8 md:px-12 lg:px-16">
        <Reveal>
          <div className="text-center">
            <span className="eyebrow">Get Started</span>
            <h2 className="display text-white1 font-semibold mt-4 text-[24px] sm:text-[28px] md:text-[36px] leading-[1.18]">판매 상담 신청</h2>
            <p className="mt-4 md:mt-5 text-white2 text-[14px] sm:text-[15px] md:text-[16px] max-w-[500px] mx-auto leading-[1.65]">
              간단한 정보를 남겨주시면 영업일 기준 24시간 이내에 담당자가 연락드립니다.
            </p>
          </div>
        </Reveal>

        <Reveal delay={140}>
          <div className="mt-8 md:mt-12 max-w-[600px] mx-auto rounded-[24px] sm:rounded-[32px] md:rounded-[40px] border border-border overflow-hidden bg-lifted"
            style={{ boxShadow: "rgba(20,20,19,0.06) 0 16px 40px 0" }}>
            {done ? (
              <div className="relative flex flex-col items-center justify-center text-center py-16 md:py-20 px-6 md:px-8" style={{ minHeight: 320 }}>
                <div style={{ position: "absolute", inset: 0, backgroundImage: "url('images/final-data.jpeg')", backgroundSize: "cover", backgroundPosition: "center" }} />
                <div style={{ position: "absolute", inset: 0, background: "rgba(243,240,238,0.75)", backdropFilter: "blur(2px)" }} />
                <div className="relative z-10 flex flex-col items-center">
                  <div style={{ width: 72, height: 72, borderRadius: "999px", background: "rgba(243,115,56,0.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F37338" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                      style={{ animation: "draw-check .4s ease .2s both", strokeDasharray: 30, strokeDashoffset: 30 }}>
                      <path d="m5 12 5 5 9-12"/>
                    </svg>
                  </div>
                  <h3 className="display text-white1 font-bold mt-5 text-[22px] sm:text-[24px]"
                    style={{ animation: "fade-up .4s ease .4s both", opacity: 0 }}>신청해 주셔서 감사합니다</h3>
                  <p className="mt-2 text-white2 text-[14px] sm:text-[15px]"
                    style={{ animation: "fade-up .4s ease .5s both", opacity: 0 }}>
                    <span className="text-white1 font-medium">{email}</span>으로<br/>영업일 기준 24시간 이내에 연락드리겠습니다.
                  </p>
                </div>
                <style>{`
                  @keyframes draw-check { to { stroke-dashoffset: 0; } }
                  @keyframes fade-up { 0% { opacity:0; transform:translateY(10px); } 100% { opacity:1; transform:translateY(0); } }
                `}</style>
              </div>
            ) : (
              <form onSubmit={submit} className="space-y-5 sm:space-y-6 p-5 sm:p-7 md:p-10 lg:p-12">

                {/* 회사명 */}
                <div>
                  <label className="block text-[13px] text-mute mb-2.5">회사명</label>
                  <input type="text" value={company} onChange={e => setCompany(e.target.value)}
                    placeholder="(주)디리턴"
                    className="ring-signal w-full rounded-[999px] bg-field border border-border2 text-white2 px-6 py-3.5 text-[15px] placeholder:text-mute outline-none transition" />
                </div>

                {/* 이메일 */}
                <div>
                  <label className="block text-[13px] text-mute mb-2.5">담당자 이메일</label>
                  <input type="email" value={email} onChange={e => { setEmail(e.target.value); setEmailErr(false); }}
                    placeholder="업무용 이메일을 입력하세요"
                    className="ring-signal w-full rounded-[999px] bg-field border text-white2 px-6 py-3.5 text-[15px] placeholder:text-mute outline-none transition"
                    style={{ borderColor: emailErr ? "#F37338" : undefined }} />
                  {emailErr && (
                    <div className="mt-2 flex items-center gap-1.5 px-1">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F37338" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                      <span className="text-[12.5px]" style={{ color: "#F37338" }}>올바른 이메일 주소를 입력해 주세요</span>
                    </div>
                  )}
                </div>

                {/* 현재 상황 */}
                <div>
                  <label className="block text-[13px] text-mute mb-3">현재 상황</label>
                  <div className="flex flex-wrap gap-2">
                    {SITUATIONS.map(s =>
                      <button key={s} type="button" onClick={() => setSituation(s)}
                        className="px-3.5 py-1.5 rounded-[999px] text-[13px] border transition"
                        style={{
                          background: situation === s ? "#F37338" : "transparent",
                          borderColor: situation === s ? "#F37338" : "#D1CDC7",
                          color: situation === s ? "#fff" : "#7a7a78",
                        }}>
                        {s}
                      </button>
                    )}
                  </div>
                </div>

                {/* 보유 데이터 */}
                <div>
                  <label className="block text-[13px] text-mute mb-3">보유 데이터 종류 <span className="text-dim">(복수 선택)</span></label>
                  <div className="flex flex-wrap gap-2">
                    {DATA_SOURCES.map(s =>
                      <button key={s} type="button" onClick={() => toggleSource(s)}
                        className="px-3.5 py-1.5 rounded-[999px] text-[13px] border transition"
                        style={{
                          background: sources.has(s) ? "#F37338" : "transparent",
                          borderColor: sources.has(s) ? "#F37338" : "#D1CDC7",
                          color: sources.has(s) ? "#fff" : "#7a7a78",
                        }}>
                        {s}
                      </button>
                    )}
                  </div>
                </div>

                {/* 산업 */}
                <div>
                  <label className="block text-[13px] text-mute mb-3">산업 분야</label>
                  <div className="flex flex-wrap gap-2">
                    {INDUSTRIES.map(ind =>
                      <button key={ind} type="button" onClick={() => setIndustry(ind)}
                        className="px-3.5 py-1.5 rounded-[999px] text-[13px] border transition"
                        style={{
                          background: industry === ind ? "#F37338" : "transparent",
                          borderColor: industry === ind ? "#F37338" : "#D1CDC7",
                          color: industry === ind ? "#fff" : "#7a7a78",
                        }}>
                        {ind}
                      </button>
                    )}
                  </div>
                </div>

                {/* 추가 문의 */}
                <div>
                  <label className="block text-[13px] text-mute mb-2.5">추가 문의사항 <span className="text-dim">(선택)</span></label>
                  <textarea rows="3" value={note} onChange={e => setNote(e.target.value)}
                    placeholder="데이터 규모, 폐업 일정, 기타 궁금한 점을 편하게 적어주세요."
                    className="ring-signal w-full rounded-[16px] bg-field border border-border2 text-white2 px-5 py-4 text-[15px] placeholder:text-mute outline-none transition resize-none" />
                </div>

                <PrimaryCTA type="submit" full disabled={loading}>
                  {loading ? (
                    <span className="inline-flex items-center gap-2">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
                        style={{ animation: "spin .7s linear infinite" }}>
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                      </svg>
                      제출 중...
                    </span>
                  ) : (
                    <span className="inline-flex items-center gap-2">판매 상담 신청하기 <IconArrowRight width="18" height="18" /></span>
                  )}
                </PrimaryCTA>
                <style>{`.cta-glow[disabled]{opacity:.75;cursor:not-allowed;transform:none!important;} @keyframes spin{to{transform:rotate(360deg)}}`}</style>
                <p className="text-center text-[13px] text-mute">신청 후 영업일 기준 24시간 이내 연락드립니다.</p>
              </form>
            )}
          </div>
        </Reveal>
      </div>
    </section>
  );
};

const Footer = () =>
  <footer className="border-t border-border py-10 md:py-14">
    <div className="max-w-[1200px] mx-auto px-5 sm:px-8 md:px-12 lg:px-16 flex flex-col md:flex-row items-start md:items-center justify-between gap-5 md:gap-6">
      <Brand size={20} />
      <div className="flex flex-col md:flex-row md:items-center gap-1.5 md:gap-8 text-[13.5px]">
        <a href="mailto:jwj4181@gmail.com" className="text-mute hover:text-white2 transition">jwj4181@gmail.com</a>
        <span className="text-dim">© 2026 D-return. All rights reserved.</span>
      </div>
    </div>
  </footer>;

// ------- App -------
const App = () => {
  const goForm = () => document.getElementById("sell-request")?.scrollIntoView({ behavior: "smooth", block: "start" });
  return (
    <React.Fragment>
      <Nav current="sell" />
      <SellHero onCTA={goForm} />
      <HowItWorks />
      <DataTypesSection />
      <SellStats />
      <WhySellSection />
      <SellForm />
      <Footer />
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
