<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Ghost Watermark Headline</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; }
  .stage { position: relative; height: 220px; overflow: hidden; }
  .ghost { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #E8E2DA; font: 500 130px/1 var(--font-sans); letter-spacing: -0.04em; user-select: none; }
  .portrait { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%);
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #F2A24E 0%, #CF4500 60%, #9A3A0A 100%);
    box-shadow: rgba(0,0,0,0.08) 0 24px 48px 0;
  }
</style>
</head><body>
  <div class="stage">
    <div class="ghost">priceless</div>
    <div class="portrait"></div>
  </div>
</body></html>
