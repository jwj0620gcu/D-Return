<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Floating Nav Pill</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; background: var(--bg); }
  .nav {
    background: #fff; border-radius: 999px;
    box-shadow: rgba(0,0,0,0.04) 0 4px 24px 0;
    padding: 14px 22px;
    display: flex; align-items: center; gap: 28px;
  }
  .logo { width: 38px; height: 24px; flex: 0 0 auto; }
  .links { display: flex; gap: 28px; flex: 1; justify-content: center; }
  .links a {
    color: #141413; font: 500 14px/1 var(--font-sans);
    letter-spacing: -0.03em; text-decoration: none;
  }
  .search {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--border-soft); background: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .search svg { width: 16px; height: 16px; }
</style>
</head><body>
  <nav class="nav">
    <img class="logo" src="../assets/mastercard-logo.svg" alt="Mastercard"/>
    <div class="links">
      <a>For you</a><a>For business</a><a>For the world</a><a>For innovators</a><a>News</a>
    </div>
    <button class="search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </nav>
</body></html>
