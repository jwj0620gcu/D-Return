<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Footer block (preview)</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 0; margin: 0; background: #141413; color: #fff; }
  .ftr { padding: 32px 32px 24px; }
  .ftr h2 { color: #fff; max-width: 560px; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; margin-top: 26px; }
  .col-h { font: 700 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 12px; }
  .ln { display: block; color: #fff; font: 450 13px/1.55 var(--font-sans); text-decoration: none; }
  .ln .ext { color: rgba(255,255,255,0.6); margin-left: 4px; }
  .div { height: 1px; background: rgba(255,255,255,0.3); margin-top: 26px; }
  .bot { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; }
  .bot small { color: rgba(255,255,255,0.6); font: 450 11px/1 var(--font-sans); }
  .pill {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px; padding: 6px 16px; font: 500 12px/1 var(--font-sans); letter-spacing: -0.02em;
  }
</style>
</head><body>
  <div class="ftr">
    <h2>We're always here when you need us.</h2>
    <div class="grid">
      <div><div class="col-h">Need help?</div>
        <a class="ln">Contact support</a><a class="ln">Lost or stolen card</a><a class="ln">Find an ATM</a></div>
      <div><div class="col-h">For business</div>
        <a class="ln">Solutions</a><a class="ln">Insights<span class="ext">↗</span></a><a class="ln">Developers</a></div>
      <div><div class="col-h">For you</div>
        <a class="ln">Cards</a><a class="ln">Benefits</a><a class="ln">Priceless<span class="ext">↗</span></a></div>
      <div><div class="col-h">Company</div>
        <a class="ln">About</a><a class="ln">Newsroom</a><a class="ln">Careers</a></div>
    </div>
    <div class="div"></div>
    <div class="bot">
      <small>© 2026 Mastercard · Privacy · Terms</small>
      <button class="pill">English (United States) ▾</button>
    </div>
  </div>
</body></html>
