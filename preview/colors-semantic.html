<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Semantic Color Aliases</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  td:first-child { width: 36px; }
  td:nth-child(2) { font-weight: 500; letter-spacing: -0.02em; }
  td:last-child { color: var(--fg-muted); font-feature-settings: "tnum"; font-size: 11px; }
  .sw { width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--border-soft); display:block; }
</style>
</head><body>
  <table>
    <tr><td><span class="sw" style="background:#F3F0EE"></span></td><td>--bg</td><td>page background</td><td>#F3F0EE</td></tr>
    <tr><td><span class="sw" style="background:#FCFBFA"></span></td><td>--bg-lifted</td><td>raised surface</td><td>#FCFBFA</td></tr>
    <tr><td><span class="sw" style="background:#141413"></span></td><td>--bg-inverse · --fg</td><td>ink surface · primary text</td><td>#141413</td></tr>
    <tr><td><span class="sw" style="background:#696969"></span></td><td>--fg-muted</td><td>secondary text</td><td>#696969</td></tr>
    <tr><td><span class="sw" style="background:#CF4500"></span></td><td>--accent</td><td>consent / signal only</td><td>#CF4500</td></tr>
    <tr><td><span class="sw" style="background:#F37338"></span></td><td>--accent-soft</td><td>orbital arcs</td><td>#F37338</td></tr>
    <tr><td><span class="sw" style="background:#3860BE"></span></td><td>--link</td><td>inline links</td><td>#3860BE</td></tr>
  </table>
</body></html>
