<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 78px; border-radius: 14px; border: 1px solid var(--border-soft); }
  .name { font-weight: 500; font-size: 13px; letter-spacing: -0.02em; line-height: 1; margin-top: 2px; }
  .hex { font-size: 11px; color: var(--fg-muted); font-feature-settings: "tnum"; line-height: 1; }
</style>
</head><body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#EB001B"></div><div class="name">Mastercard Red</div><div class="hex">#EB001B · logo only</div></div>
    <div class="swatch"><div class="chip" style="background:#F79E1B"></div><div class="name">Mastercard Yellow</div><div class="hex">#F79E1B · logo only</div></div>
    <div class="swatch"><div class="chip" style="background:#141413"></div><div class="name">Ink Black</div><div class="hex">#141413 · primary CTA, footer</div></div>
  </div>
</body></html>
