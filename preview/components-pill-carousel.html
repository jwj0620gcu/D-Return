<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Pill Carousel Card + Chip</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; }
  .pill-card {
    width: 100%; height: 280px;
    border-radius: 999px;
    background:
      radial-gradient(120% 100% at 30% 60%, rgba(255,255,255,0.0) 60%, rgba(0,0,0,0.25) 100%),
      linear-gradient(135deg, #F2A24E 0%, #CF4500 60%, #5b1f00 100%);
    position: relative;
    overflow: hidden;
  }
  .chip {
    position: absolute; top: 28px; left: 36px;
    background: #fff; color: #141413; border-radius: 999px;
    padding: 8px 18px; font: 500 13px/1 var(--font-sans);
    letter-spacing: -0.02em;
  }
  .cta {
    position: absolute; bottom: 28px; left: 36px;
    background: #141413; color: var(--mc-canvas); border: 0; border-radius: 40px;
    padding: 14px 30px; font: 500 16px/1 var(--font-sans);
    letter-spacing: -0.02em; cursor: pointer;
  }
</style>
</head><body>
  <div class="pill-card">
    <span class="chip">Story</span>
    <button class="cta">Read the story →</button>
  </div>
</body></html>
