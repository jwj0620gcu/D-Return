<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 0; margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: 220px; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 20px; }
  .cream { background: var(--bg); }
  .ink { background: #141413; }
  img { max-width: 60%; height: auto; }
</style>
</head><body>
  <div class="row">
    <div class="cell cream"><img src="../assets/mastercard-wordmark.svg" alt="Mastercard wordmark on cream"/></div>
    <div class="cell ink"><img src="../assets/mastercard-logo-white.svg" alt="Mastercard wordmark on ink"/></div>
  </div>
</body></html>
