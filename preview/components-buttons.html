<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Buttons — Primary & Secondary</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 36px 28px; margin: 0; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .btn-primary {
    background: #141413; color: var(--mc-canvas);
    border: 1.5px solid #141413;
    border-radius: 20px; padding: 8px 26px;
    font: var(--fw-headline) 16px/1.3 var(--font-sans);
    letter-spacing: -0.02em;
    cursor: pointer;
  }
  .btn-secondary {
    background: #FFFFFF; color: #141413;
    border: 1.5px solid #141413;
    border-radius: 20px; padding: 8px 26px;
    font: 450 16px/1.3 var(--font-sans);
    cursor: pointer;
  }
  .lbl { display: block; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; margin-bottom: 12px; }
</style>
</head><body>
  <span class="lbl">Body CTA · 20px radius</span>
  <div class="row">
    <button class="btn-primary">Learn more</button>
    <button class="btn-secondary">Explore solutions</button>
    <button class="btn-primary" style="padding: 14px 36px; border-radius: 40px; font-size: 18px;">Get started</button>
  </div>
</body></html>
