<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Iconography (Lucide substitute)</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 28px; margin: 0; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; align-items: center; justify-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  svg { width: 22px; height: 22px; stroke: #141413; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-size: 9px; color: var(--fg-muted); }
  .note { display: block; margin-top: 16px; font-size: 10px; color: var(--fg-muted); }
</style>
</head><body>
  <div class="row">
    <div class="cell"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg><span class="label">arrow</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="label">search</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg><span class="label">menu</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><span class="label">chevron</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><path d="m7 17 10-10"/><path d="M8 7h9v9"/></svg><span class="label">external</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span class="label">card</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span class="label">support</span></div>
    <div class="cell"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="label">map</span></div>
