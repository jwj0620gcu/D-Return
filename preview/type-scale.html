<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-feature-settings: "tnum"; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border-soft); }
  th { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; }
  td.role { font-weight: 500; letter-spacing: -0.02em; font-size: 13px; }
</style>
</head><body>
  <table>
    <thead><tr><th>Role</th><th>Size</th><th>Weight</th><th>Line</th><th>Track</th></tr></thead>
    <tbody>
      <tr><td class="role">H1 hero</td><td>64px</td><td>500</td><td>1.0</td><td>−2%</td></tr>
      <tr><td class="role">H2 section</td><td>36px</td><td>500</td><td>1.22</td><td>−2%</td></tr>
      <tr><td class="role">H3 card</td><td>24px</td><td>500</td><td>1.2</td><td>−2%</td></tr>
      <tr><td class="role">Eyebrow (uppercase)</td><td>14px</td><td>700</td><td>1.0</td><td>+4%</td></tr>
      <tr><td class="role">Body</td><td>16px</td><td><b>450</b></td><td>1.4</td><td>0</td></tr>
      <tr><td class="role">Nav / Button</td><td>16px</td><td>500</td><td>1.0</td><td>−3%</td></tr>
      <tr><td class="role">Footer link</td><td>14px</td><td>450</td><td>1.4</td><td>0</td></tr>
      <tr><td class="role">Footer column header</td><td>12–14px</td><td>700</td><td>1.0</td><td>+4%</td></tr>
    </tbody>
  </table>
</body></html>
