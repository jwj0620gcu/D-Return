<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Neutrals & Text</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; margin: 0; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .swatch { display: flex; flex-direction: column; gap: 5px; }
  .chip { height: 60px; border-radius: 12px; border: 1px solid var(--border-soft); }
  .name { font-weight: 500; font-size: 12px; letter-spacing: -0.02em; line-height: 1.1; }
  .hex { font-size: 10px; color: var(--fg-muted); font-feature-settings: "tnum"; line-height: 1; }
</style>
</head><body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#141413"></div><div class="name">Ink Black</div><div class="hex">#141413</div></div>
    <div class="swatch"><div class="chip" style="background:#262627"></div><div class="name">Charcoal</div><div class="hex">#262627</div></div>
    <div class="swatch"><div class="chip" style="background:#555555"></div><div class="name">Granite</div><div class="hex">#555555</div></div>
    <div class="swatch"><div class="chip" style="background:#696969"></div><div class="name">Slate Gray</div><div class="hex">#696969</div></div>
    <div class="swatch"><div class="chip" style="background:#D1CDC7"></div><div class="name">Dust Taupe</div><div class="hex">#D1CDC7</div></div>
  </div>
</body></html>
