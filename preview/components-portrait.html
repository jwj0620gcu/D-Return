<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>Circular Portrait + Satellite</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 28px 32px; margin: 0; }
  .wrap { display: flex; gap: 56px; align-items: flex-start; }
  .portrait-wrap { position: relative; width: 220px; }
  .portrait {
    width: 220px; height: 220px; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 35% 30%, #F2A24E 0%, #CF4500 60%, #9A3A0A 100%);
    box-shadow: rgba(0,0,0,0.08) 0 24px 48px 0;
  }
  .satellite {
    position: absolute; right: -10px; bottom: 12px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #fff; border: 0; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: rgba(0,0,0,0.08) 0 8px 24px 0; cursor: pointer;
  }
  .satellite svg { width: 22px; height: 22px; }
  .meta { padding-top: 16px; max-width: 240px; }
  .meta .mc-eyebrow { margin-bottom: 10px; }
  .meta h3 { margin-top: 6px; }
</style>
</head><body>
  <div class="wrap">
    <div class="portrait-wrap">
      <div class="portrait"></div>
      <button class="satellite" aria-label="Explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
      </button>
    </div>
    <div class="meta">
      <span class="mc-eyebrow">Services</span>
      <h3 style="margin-top:14px">Card services for every business</h3>
    </div>
  </div>
</body></html>
